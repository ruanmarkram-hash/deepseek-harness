name: Desktop shell

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'native/remote-host-app/desktop-shell/**'
      - '.github/workflows/desktop-ci.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run apps/desktop
      - run: node --test native/remote-host-app/desktop-shell/tests/*.test.mjs
      - run: pnpm --filter @deepseek-ai/dsh-desktop run build
