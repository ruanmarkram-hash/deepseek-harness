name: Desktop shell

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/desktop-runtime/**'
      - '.github/workflows/desktop-ci.yml'
      - 'scripts/build-desktop-runtime.ts'
      - 'scripts/build-desktop-runtime.spec.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @deepseek-ai/dsh-desktop run test
      - run: pnpm --filter @deepseek-ai/dsh-desktop run check
      - run: pnpm --filter @deepseek-ai/dsh-desktop run stage:runtime
      - run: pnpm --filter @deepseek-ai/dsh-desktop run package:macos:staged
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-macos-arm64
          path: .dsh-build/packages/*
          if-no-files-found: error
          retention-days: 7
